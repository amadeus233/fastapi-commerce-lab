<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 42px "Microsoft YaHei",Arial;fill:#0f172a}.sub{font:400 20px "Microsoft YaHei",Arial;fill:#475569}
      .h{font:700 24px "Microsoft YaHei",Arial;fill:#111827}.t{font:400 17px "Microsoft YaHei",Arial;fill:#334155}.c{font:700 16px Consolas,monospace;fill:#0f172a}
      .line{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow);stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="70" y="70" class="title">fastapi-commerce-lab 项目总览</text>
  <text x="72" y="108" class="sub">FastAPI 电商数据平台：PostgreSQL 存数据，Redis 做缓存，前端看板可视化观察</text>

  <rect x="70" y="155" width="1460" height="165" rx="22" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="105" y="198" class="h">前端与入口</text>
  <rect x="120" y="225" width="280" height="70" rx="12" fill="#fff" stroke="#818cf8" stroke-width="2"/>
  <text x="145" y="255" class="h">浏览器看板</text><text x="145" y="282" class="c">/api/v1/ecommerce/dashboard</text>
  <rect x="520" y="225" width="260" height="70" rx="12" fill="#fff" stroke="#818cf8" stroke-width="2"/>
  <text x="545" y="255" class="h">Uvicorn</text><text x="545" y="282" class="t">监听 localhost:11000</text>
  <rect x="900" y="225" width="260" height="70" rx="12" fill="#fff" stroke="#818cf8" stroke-width="2"/>
  <text x="925" y="255" class="h">main.py</text><text x="925" y="282" class="t">创建 FastAPI app</text>
  <path d="M400 260 H520" class="line"/><path d="M780 260 H900" class="line"/>

  <rect x="70" y="365" width="1460" height="230" rx="22" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="105" y="408" class="h">后端分层</text>
  <rect x="120" y="440" width="230" height="105" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="145" y="475" class="h">app/routes.py</text><text x="145" y="505" class="t">总路由汇总</text><text x="145" y="530" class="c">/api/v1</text>
  <rect x="430" y="440" width="250" height="105" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="455" y="475" class="h">ecommerce/api.py</text><text x="455" y="505" class="t">页面和 API 接口</text>
  <rect x="760" y="440" width="280" height="105" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="785" y="475" class="h">ecommerce/services.py</text><text x="785" y="505" class="t">查询、缓存、事件</text>
  <rect x="1120" y="440" width="270" height="105" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="1145" y="475" class="h">ecommerce/dashboard.py</text><text x="1145" y="505" class="t">原生前端页面</text>
  <path d="M1030 295 C1030 350 235 350 235 440" class="line"/><path d="M350 493 H430" class="line"/><path d="M680 493 H760" class="line"/><path d="M1040 493 H1120" class="dash"/>

  <rect x="70" y="640" width="1460" height="250" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="105" y="683" class="h">数据与缓存</text>
  <rect x="120" y="720" width="280" height="115" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="755" class="h">PostgreSQL</text><text x="145" y="785" class="t">客户、商品、订单、明细</text><text x="145" y="812" class="c">320 / 150 / 2500 / 6264</text>
  <rect x="500" y="720" width="300" height="115" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="755" class="h">Redis Cache</text><text x="525" y="785" class="t">看板缓存 key + TTL</text><text x="525" y="812" class="c">ecommerce:dashboard:*</text>
  <rect x="900" y="720" width="260" height="115" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="925" y="755" class="h">API Logs</text><text x="925" y="785" class="t">Redis List 事件流</text><text x="925" y="812" class="c">ecommerce:events</text>
  <rect x="1260" y="720" width="220" height="115" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="1285" y="755" class="h">Docker Compose</text><text x="1285" y="785" class="t">web / postgres / redis</text>
  <path d="M900 545 C900 650 260 650 260 720" class="line"/><path d="M900 545 C900 650 650 650 650 720" class="line"/><path d="M900 545 C930 650 1030 650 1030 720" class="line"/>
  <text x="80" y="948" class="sub">观察路径：经营总览 -> Redis Cache -> API Logs，看同一查询如何从 MISS 变成 HIT。</text>
</svg>
